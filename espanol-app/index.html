<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5be0">
  <title>Vámonos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">ñ</span>Vámonos</div>
    <div class="stats">
      <span title="Day streak">🔥 <b id="streak">0</b></span>
      <span title="Total XP">⭐ <b id="xp">0</b></span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs" aria-label="Main">
    <button data-tab="home" class="active" aria-label="Learn">
      <svg class="ti ti-torii" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V9.5L12 4l8 5.5V21"/><path d="M9.5 21v-5.5a2.5 2.5 0 0 1 5 0V21"/><path d="M2.5 21h19" class="thick"/></svg>
      <span class="tab-label">Learn</span></button>
    <button data-tab="watch" aria-label="Watch">
      <svg class="ti ti-watch" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="4.5" width="18.4" height="13" rx="3.5"/><path d="M10.2 8.4l4.6 2.6-4.6 2.6z" class="fill"/><path d="M8.5 20.5h7"/></svg>
      <span class="tab-label">Watch</span></button>
    <button data-tab="speak" aria-label="Speak">
      <svg class="ti ti-speak" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7.5L7 20.2v-3.7H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01" class="dots"/></svg>
      <span class="tab-label">Speak</span><span class="tab-dot" id="dotSpeak" hidden></span></button>
    <button data-tab="review" aria-label="Review">
      <svg class="ti ti-enso" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 5.3A8.6 8.6 0 1 0 20.6 12" class="enso"/><path d="M20.9 8.6l-.3 3.6-3.3-1.2" /></svg>
      <span class="tab-label">Review</span><span class="tab-badge" id="badgeReview" hidden></span></button>
    <button data-tab="chart" aria-label="Verbs">
      <svg class="ti ti-brush" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.5c-4 0-7-2.8-7-6.6 0-3.3 2.4-5.1 3.6-7.9.6 1.6 1.6 2.6 2.6 3 .2-3.2 1.9-5.7 4.3-7.5-.3 2.6.6 4.6 2 6.6 1.3 1.8 2.5 3.5 2.5 5.8 0 3.8-3 6.6-7 6.6z"/><path d="M12 21.5c-1.7 0-3-1.2-3-2.9 0-1.6 1.3-2.4 2-3.9.9 1.3 1.6 1.6 2.4 1.9.3-.9.6-1.4 1.2-2 .4 1.2.4 2.8.4 4 0 1.7-1.3 2.9-3 2.9z" class="fill"/></svg>
      <span class="tab-label">Verbs</span></button>
    <button data-tab="profile" aria-label="Me">
      <svg class="ti ti-fox" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 9.5L4.6 3.5l4.4 3.4h6l4.4-3.4-.9 6"/><path d="M4.6 3.5V1.5M19.4 3.5V1.5"/><path d="M5.5 9.5C4.2 11.6 4 13.8 4.6 15.6L2.8 18l3.4-.8C7.8 19.5 9.8 20.5 12 20.5s4.2-1 5.8-3.3l3.4.8-1.8-2.4c.6-1.8.4-4-.9-6.1"/><path d="M9.2 12.2h.01M14.8 12.2h.01" class="dots"/><path d="M11 15h2l-1 1.1z" class="fill"/></svg>
      <span class="tab-label">Me</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="course-a1.js"></script>
  <script src="course-a2.js"></script>
  <script src="course-advanced.js"></script>
  <script src="levels.js"></script>
  <script src="speak-data.js"></script>
  <script src="voice-config.js"></script>
  <script src="voice-engine.js"></script>
  <script src="mascot.js"></script>
  <script src="app.js"></script>
  <script src="speak.js"></script>
  <script src="speak-gym-data.js"></script>
  <script src="speak-gym.js"></script>
  <script src="notes.js"></script>
  <script src="voice-studio.js"></script>
  <script src="placement.js"></script>
  <script src="journey.js"></script>
  <script src="watch.js"></script>
  <script src="conjugate.js"></script>
  <script src="goals.js"></script>
</body>
</html>
