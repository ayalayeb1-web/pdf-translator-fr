<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff7aa2">
  <title>Nihongo Path</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">道</span>Nihongo Path</div>
    <div class="stats">
      <span title="Day streak">🔥 <b id="streak">0</b></span>
      <span title="Total XP">⭐ <b id="xp">0</b></span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <span class="tab-ink" aria-hidden="true"></span>
    <button data-tab="home" class="active"><span>🏠</span>Learn</button>
    <button data-tab="watch"><span>🎬</span>Watch</button>
    <button data-tab="speak"><span>🗣️</span>Speak</button>
    <button data-tab="review"><span>🔁</span>Review</button>
    <button data-tab="chart"><span>✍️</span>Write</button>
    <button data-tab="profile"><span>📈</span>Me</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="course-a1.js"></script>
  <script src="course-a2.js"></script>
  <script src="course-advanced.js"></script>
  <script src="course-extra.js"></script>
  <script src="levels.js"></script>
  <script src="speak-data.js"></script>
  <script src="mascot.js"></script>
  <script src="app.js"></script>
  <script src="speak.js"></script>
  <script src="speak-gym-data.js"></script>
  <script src="speak-gym.js"></script>
  <script src="writing.js"></script>
  <script src="notes.js"></script>
  <script src="placement.js"></script>
  <script src="journey.js"></script>
  <script src="watch.js"></script>
</body>
</html>
