name: Voya · Windows build

on:
  push:
    paths: ["voya/**", ".github/workflows/voya-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: voya
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build Windows release (EXE)
        run: flutter build windows --release

      - name: Integration test in a real Windows window
        run: flutter test integration_test/app_test.dart -d windows

      - name: Smoke test of the release EXE
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\Voya.exe"
          if (!(Test-Path $exe)) { throw "Voya.exe missing" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "Voya.exe exited early with code $($p.ExitCode)" }
          Write-Host "Voya.exe is running (pid $($p.Id)), memory $([math]::Round($p.WorkingSet64/1MB)) MB"
          Stop-Process -Id $p.Id -Force

      - name: Installer (Inno Setup → Setup.exe)
        shell: pwsh
        run: |
          if (!(Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (!$iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=0.1.0 installer\voya.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Silent install / uninstall test of Setup.exe
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\installer\Voya-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /CURRENTUSER /NORESTART /DIR=`"$env:RUNNER_TEMP\VoyaInstall`"" -Wait
          if (!(Test-Path "$env:RUNNER_TEMP\VoyaInstall\Voya.exe")) { throw "Install failed" }
          Start-Process "$env:RUNNER_TEMP\VoyaInstall\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait
          Write-Host "Install + uninstall OK"

      - name: MSIX package
        run: dart run msix:create --build-windows false

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\Voya-0.1.0-portable-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Voya-Windows
          path: |
            voya/build/installer/Voya-Setup-*.exe
            voya/build/Voya-0.1.0-portable-win64.zip
            voya/build/windows/x64/runner/Release/*.msix

      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'claude/happy-mayer-eb0gcy'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voya-v0.1.0
          name: Voya 0.1.0 (Windows, préversion)
          prerelease: true
          body: |
            Préversion Windows de Voya, compilée et testée automatiquement par GitHub Actions.
            - **Voya-Setup-0.1.0.exe** : installateur recommandé (pas de droits administrateur requis).
            - **Voya-0.1.0-portable-win64.zip** : version portable, décompresser et lancer Voya.exe.
            - **Voya.msix** : paquet MSIX signé avec un certificat de test (voir docs/WINDOWS-BUILD.md).
          files: |
            voya/build/installer/Voya-Setup-*.exe
            voya/build/Voya-0.1.0-portable-win64.zip
            voya/build/windows/x64/runner/Release/*.msix
